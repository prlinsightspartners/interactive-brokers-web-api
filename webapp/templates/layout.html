<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Interactive Brokers Client Portal{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    </head>
    <body style="padding-top: 72px;">
        <nav class="app-navbar fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-between">
                    <a href="/" class="navbar-brand">
                        <span>📈</span>
                        <span>IBKR Web API</span>
                    </a>
                    <ul class="nav align-items-center">
                        <li class="nav-item"><a href="/" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a></li>
                        <li class="nav-item"><a href="/portfolio" class="nav-link {% if request.endpoint == 'portfolio' %}active{% endif %}">Portfolio</a></li>
                        <li class="nav-item"><a href="/lookup" class="nav-link {% if request.endpoint == 'lookup' %}active{% endif %}">Stock Lookup</a></li>
                        <li class="nav-item"><a href="/orders" class="nav-link {% if request.endpoint == 'orders' %}active{% endif %}">Orders</a></li>
                        <li class="nav-item"><a href="/scanner" class="nav-link {% if request.endpoint == 'scanner' %}active{% endif %}">Scanner</a></li>
                        {% if accounts %}
                        <li class="nav-item ms-3">
                            <form method="get" action="/switch-account" class="d-flex align-items-center gap-2">
                                <label for="account-select" class="text-light small mb-0">Account</label>
                                <select id="account-select" name="account_id" class="form-select form-select-sm" style="width: auto; min-width: 140px;" onchange="this.form.submit()">
                                    {% for acct in accounts %}
                                    <option value="{{ acct.accountId }}" {% if acct.accountId == selected_account_id %}selected{% endif %}>
                                        {{ acct.accountId }}{% if acct.accountAlias %} - {{ acct.accountAlias }}{% endif %}
                                    </option>
                                    {% endfor %}
                                </select>
                            </form>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>

        <main class="app-container">
            <div class="container">
                {% block content %}
                {% endblock %}
            </div>
        </main>

        <footer class="app-footer">
            <div class="container">
                <p>Interactive Brokers Client Portal Demo &middot; Data provided by IBKR Web API</p>
            </div>
        </footer>
    </body>
</html>
