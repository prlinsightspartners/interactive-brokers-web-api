version: '3.8'
services:
  web:
    build: .
    image: ibkr-rest-api
    container_name: ibkr
    environment:
      IBKR_ACCOUNT_ID: "${IBKR_ACCOUNT_ID:?Set IBKR_ACCOUNT_ID}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?Set WEBHOOK_SECRET}"
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN}"
    ports:
      - "5055:5055"
      - "5056:5056"
      - "4002:4002"
      - "4040:4040"
    volumes:
      - ./webapp:/app/webapp
      - ./ibkr-algo-tradeapp:/app/ibkr-algo-tradeapp